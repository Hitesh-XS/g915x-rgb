[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g915x-rgb"
version = "0.3.0"
description = "Lighting control for the Logitech G915 X keyboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyGObject", "dbus-python", "PySide6"]

[project.optional-dependencies]
typing = ["evdev"]
test = ["pytest"]

[project.scripts]
g915x-rgb-apply = "g915x_rgb.apply:main"
g915x-rgb-daemon = "g915x_rgb.daemon:main"

[project.gui-scripts]
g915x-rgb = "g915x_rgb.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
g915x_rgb = ["qml/*.qml", "*.js"]
